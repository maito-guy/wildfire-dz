# One command for the whole demo: `docker compose up -d --build` (or `make docker-up`).
# Data and model artifacts are mounted read-only: drop new files in, then `docker compose restart` (no rebuild).
services:
  api:
    build: .
    image: wildfire-dz:local
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data/out:/app/data/out:ro
      - ./model/artifacts:/app/model/artifacts:ro
    restart: unless-stopped
