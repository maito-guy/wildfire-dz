# One command for the whole demo: `docker compose up -d --build` (or `make docker-up`).
# Data and model artifacts are mounted read-only (the live FIRMS file, #61, lives in the named volume firms_live): drop new files in, then `docker compose restart` (no rebuild).
services:
  api:
    build: .
    image: wildfire-dz:local
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data/out:/app/data/out:ro
      - ./model/artifacts:/app/model/artifacts:ro
      - firms_live:/app/data/live           # written by the live FIRMS loop (#61); a named volume, so the app user owns it
    restart: unless-stopped

volumes:
  firms_live:
